<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J256</title>
<script>
  (function () {
    var saved = localStorage.getItem("j_theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&display=swap" rel="stylesheet">
<!-- KaTeX: renders the $...$ / $$...$$ LaTeX syntax in post/article bodies -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="window.__katexReady = true; document.dispatchEvent(new Event('katex-ready'));"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><line x1="7" y1="3" x2="7" y2="15" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <span class="sidebar-wordmark">J256</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" data-view="explore">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><path d="M9 2.5v2.2M9 13.3v2.2M2.5 9h2.2M13.3 9h2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="nav-label">Explore</span>
      </button>
      <button class="nav-item" data-view="home">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.5 8.5L9 2.5l6.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 7.5V15h10V7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-view="magazine">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3" width="13" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><line x1="5" y1="6" x2="10.5" y2="6" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="8.3" x2="10.5" y2="8.3" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="10.6" x2="8" y2="10.6" stroke="currentColor" stroke-width="1.2"/><line x1="12.3" y1="6" x2="12.3" y2="12" stroke="currentColor" stroke-width="1.2"/></svg>
        <span class="nav-label">E-Magazine</span>
      </button>
      <button class="nav-item" data-view="drafts">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 2.5h7l3 3V15.5H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 2.5V5.5H14" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="6.2" y1="9" x2="11.8" y2="9" stroke="currentColor" stroke-width="1.1"/><line x1="6.2" y1="11.3" x2="11.8" y2="11.3" stroke="currentColor" stroke-width="1.1"/></svg>
        <span class="nav-label">Saved Drafts</span>
      </button>
      <button class="nav-item" data-view="reported" id="reportedNavItem" hidden>
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2.5l6.5 12H2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="9" y1="7.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="9" cy="12.7" r="0.9" fill="currentColor"/></svg>
        <span class="nav-label">Reported Posts</span>
      </button>
      <button class="nav-item" data-view="ban-polls">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M6 9.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="nav-label">Ban Polls</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="theme-toggle-icon" id="themeToggleIcon"></span>
        <span class="theme-toggle-label" id="themeToggleLabel">Dark mode</span>
      </button>
      <div id="authArea"></div>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menu">
    <svg width="20" height="20" viewBox="0 0 18 18" fill="none"><line x1="2.5" y1="5" x2="15.5" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="2.5" y1="9" x2="15.5" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="2.5" y1="13" x2="15.5" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>

  <main class="content" id="app"></main>

</div>

<script src="formatting.js"></script>
<script src="app.js"></script>
</body>
</html>
